[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "walkability-project"
version = "0.1.0"
description = "A small Python/PostgreSQL pipeline for cross-city housing and mobility analysis"
requires-python = ">=3.13"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["ruff==0.17.2"]

[project.scripts]
walkability-load = "walkability.pipeline:main"
walkability-analyze = "walkability.analysis:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.ruff]
target-version = "py313"
line-length = 88
include = ["*.py"]
extend-exclude = ["notebooks", "local-plans"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
