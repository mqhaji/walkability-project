[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "walkability-project"
version = "0.1.0"
description = "A small Python/PostgreSQL pipeline for cross-city housing and mobility analysis"
requires-python = ">=3.13"
dynamic = ["dependencies"]

[project.scripts]
walkability-load = "walkability.pipeline:main"
walkability-analyze = "walkability.analysis:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}